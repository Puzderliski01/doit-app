<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DoIT" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#050508" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>DoIT — Task Management Suite</title>
    <meta name="description" content="Modern task management app with priority matrices, deadline tracking, fitness tracking, AI insights, and cloud sync. Available in 10 languages." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DoIT — Task Management Suite" />
    <meta property="og:description" content="Modern task management with priority matrices, deadline tracking, fitness tracking, AI insights, and cloud sync." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://doit-app.web.app" />
    <meta property="og:site_name" content="DoIT" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DoIT — Task Management Suite" />
    <meta name="twitter:description" content="Modern task management with priority matrices, deadline tracking, fitness tracking, AI insights, and cloud sync." />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-amber-500/20 selection:text-amber-300">
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run DoIT.</noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for push notifications and offline caching
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.error('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
